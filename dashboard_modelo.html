<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do honeypot SSH</title>
<meta name="description" content="Dados reais de um honeypot SSH (Cowrie): quem tenta entrar, com quais senhas e o que faz depois.">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --base: #c3c2b7;
  --s1: #2a78d6; --s2: #eb6834;
  --border: rgba(11,11,11,.10); --hover: rgba(11,11,11,.05);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --base: #383835;
    --s1: #3987e5; --s2: #d95926;
    --border: rgba(255,255,255,.10); --hover: rgba(255,255,255,.06);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --base: #383835;
  --s1: #3987e5; --s2: #d95926;
  --border: rgba(255,255,255,.10); --hover: rgba(255,255,255,.06);
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px; line-height: 1.5;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 28px 16px 64px; }
header.top { margin-bottom: 20px; }
h1 { font-size: clamp(22px, 4.2vw, 30px); line-height: 1.2; margin: 0 0 6px; font-weight: 650; letter-spacing: -.01em; }
.lede { margin: 0; color: var(--ink-2); max-width: 70ch; }
.period { margin: 10px 0 0; font-size: 13px; color: var(--ink-2); }

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px 18px; min-width: 0;
}
.card-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
h2 { font-size: 15px; font-weight: 600; margin: 0; line-height: 1.35; }
.sub { margin: 4px 0 12px; font-size: 13px; color: var(--ink-2); }
.tbl {
  flex: none; font: inherit; font-size: 12px; color: var(--ink-2);
  background: transparent; border: 1px solid var(--border); border-radius: 6px;
  padding: 3px 9px; cursor: pointer;
}
.tbl:hover { background: var(--hover); }
.tbl[aria-pressed="true"] { color: var(--ink); background: var(--hover); }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }

.stack { display: grid; gap: 12px; }
.row-top { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 820px) { .row-top { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); } }
.hero .big { font-size: clamp(48px, 9vw, 64px); line-height: 1.05; font-weight: 650; letter-spacing: -.02em; margin: 6px 0 4px; }
.hero .lab { font-size: 13px; color: var(--ink-2); margin: 0; }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tile .v { font-size: 26px; font-weight: 650; line-height: 1.15; margin: 4px 0 2px; letter-spacing: -.01em; }
.tile .l { font-size: 13px; color: var(--ink-2); margin: 0; }
.tile .n { font-size: 12px; color: var(--ink-2); margin: 6px 0 0; }

.callout h2 { font-size: 17px; }
.callout p { margin: 8px 0 0; color: var(--ink-2); max-width: 80ch; }
.callout p strong { color: var(--ink); font-weight: 600; }
.seg { display: flex; gap: 2px; height: 8px; margin: 14px 0 8px; }
.seg span { min-width: 3px; }
.seg span:first-child { border-radius: 4px 0 0 4px; }
.seg span:last-child { border-radius: 0 4px 4px 0; }
.seg span:only-child { border-radius: 4px; }
.keys { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--ink-2); }
.keys i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.keys b { color: var(--ink); font-weight: 600; }

.cols { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 470px), 1fr)); }

.viz svg { display: block; max-width: 100%; overflow: visible; }
.viz svg text { font-family: inherit; }
.hot { filter: brightness(1.14); }
.note { margin: 8px 0 0; font-size: 12px; color: var(--ink-2); }

.hb { display: flex; align-items: center; gap: 10px; padding: 3px 0; border-radius: 6px; }
.hb:hover { background: var(--hover); }
.hb-l { flex: none; width: 36%; max-width: 200px; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb-t { flex: 1; min-width: 0; display: flex; align-items: center; }
.hb-b { height: 12px; min-width: 2px; border-radius: 0 4px 4px 0; flex: none; }
.hb-v { margin-left: 8px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.mono, code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }

.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { font-weight: 600; color: var(--ink-2); font-size: 12px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; padding-left: 14px; padding-right: 18px; }
table.last-num td.num, table.last-num th.num { padding-right: 0; }
td code { word-break: break-all; }
td a { color: var(--s1); }
.tag { display: inline-block; font-size: 12px; color: var(--ink-2); }

.about p { margin: 6px 0 0; color: var(--ink-2); font-size: 13.5px; max-width: 80ch; }
.about p strong { color: var(--ink); font-weight: 600; }
footer { margin-top: 16px; font-size: 12.5px; color: var(--ink-2); }
footer a { color: var(--s1); }

.tip {
  position: fixed; z-index: 10; pointer-events: none; max-width: 280px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.4;
  box-shadow: 0 4px 16px rgba(0,0,0,.14);
}
.tip[hidden] { display: none; }
.tip-t { color: var(--ink-2); margin-bottom: 3px; }
.tip-r { display: flex; align-items: center; gap: 7px; }
.tip-r strong { font-size: 14px; font-weight: 650; }
.tip-r .nm { color: var(--ink-2); }
.tip-r .key { width: 12px; height: 2px; border-radius: 1px; flex: none; }
.tip-r.extra .nm { color: var(--ink-2); font-style: italic; }
noscript { display: block; padding: 16px; }
</style>
</head>

/* ---------- dados derivados ---------- */
var A = D.acessos || {};

var topo = D.ip_mais_ativo || null;
var temTopo = !!(topo && topo.pct_dos_acessos >= 20);
var primeiroDia = (P.primeiro_evento_utc || '').slice(0, 10), primeiraHora = (P.primeiro_evento_utc || '').slice(11, 16);
var ultimoDia = (P.ultimo_evento_utc || '').slice(0, 10), ultimaHora = (P.ultimo_evento_utc || '').slice(11, 16);
function incompleto(dia) {
  return (dia === primeiroDia && primeiraHora > '00:10') || (dia === ultimoDia && ultimaHora && ultimaHora < '23:50');
}
var catsDia = dias.map(function (d) {
  var par = incompleto(d.dia);
  return { label: ddmm(d.dia) + (par ? '*' : ''), title: ddmm(d.dia) + ' (UTC)', partial: par };
});
var haParcial = catsDia.some(function (c) { return c.partial; });

/* ---------- página ---------- */
var stack = h('div', { 'class': 'stack' });
app.appendChild(h('header', { 'class': 'top' }, [
  h('h1', { text: 'O que bate na porta de um servidor exposto na internet' }),
  h('p', { 'class': 'lede', text: 'Painel com dados reais de um honeypot SSH: um servidor-isca, sem nenhum uso legítimo, que registra quem tenta entrar, com quais senhas e o que faz depois.' }),
  h('p', { 'class': 'period', text: 'Coleta de ' + dataHora(P.primeiro_evento_utc) + ' a ' + dataHora(P.ultimo_evento_utc) + ' (UTC)' + (D.gerado_em ? ' · atualizado em ' + new Date(D.gerado_em).toLocaleDateString('pt-BR') : '') })
]));
app.appendChild(stack);

/* destaque + KPIs */
var up = (D.arquivos_enviados || []);
var upTotal = sum(up.map(function (u) { return u.total; }));
var top2 = h('div', { 'class': 'row-top' });
top2.appendChild(h('section', { 'class': 'card hero' }, [
  h('p', { 'class': 'lab', text: 'Origens diferentes (IPs distintos)' }),
  h('div', { 'class': 'big', text: fmt(A.ips_distintos || 0) }),
  h('p', { 'class': 'lab', text: 'tentaram entrar na isca em ' + dias.length + ' dias de coleta.' })
]));
var kp = h('div', { 'class': 'kpis' });
function tile(label, value, note) {
  kp.appendChild(h('section', { 'class': 'card tile' }, [
    h('p', { 'class': 'l', text: label }), h('div', { 'class': 'v', text: fmt(value) }), h('p', { 'class': 'n', text: note })
  ]));
}
tile('Tentativas de acesso', A.total || 0, pc(A.pct_aceitos || 0) + ' aceitas pela isca, de propósito');
tile('Comandos digitados', (D.comandos || {}).total || 0, fmt((D.comandos || {}).distintos || 0) + ' comandos diferentes');
tile('Arquivos enviados à isca', upTotal, fmt(up.length) + ' arquivos diferentes (hashes)');
tile('Pedidos de túnel', (D.tuneis || {}).total || 0, 'tentativas de usar a isca como ponte');
top2.appendChild(kp);
stack.appendChild(top2);

/* um IP só */
if (temTopo) {
  var seg = h('div', { 'class': 'seg', role: 'img', 'aria-label': 'Um IP: ' + pc(topo.pct_dos_acessos) + ' das tentativas; os outros: ' + pc(100 - topo.pct_dos_acessos) });
  seg.appendChild(h('span', { style: 'flex:' + topo.acessos + ' 1 0;background:var(--s2)' }));
  seg.appendChild(h('span', { style: 'flex:' + Math.max(topo.acessos_demais, 0) + ' 1 0;background:var(--s1)' }));
  var dd = dur(topo.duracao_s);
  var linha1 = h('p', {}, [
    'Esse endereço fez ', h('strong', { text: fmt(topo.acessos) + ' tentativas' }),
    dd ? ' em ' + dd : '',
    (topo.duracao_s && topo.duracao_s > 0 && topo.acessos / topo.duracao_s >= 0.5) ? ' (cerca de ' + (topo.acessos / topo.duracao_s).toFixed(1).replace('.', ',') + ' por segundo)' : '',
    ' e testou ', h('strong', { text: fmt(topo.senhas_distintas) + ' senhas diferentes' }), '.'
  ]);
  var calloutKids = [
    h('h2', { text: '1 IP sozinho respondeu por ' + pc(topo.pct_dos_acessos) + ' das tentativas' }),
    seg,
    h('div', { 'class': 'keys' }, [
      h('span', {}, [h('i', { style: 'background:var(--s2)' }), 'IP mais ativo ', h('b', { text: fmt(topo.acessos) })]),
      h('span', {}, [h('i', { style: 'background:var(--s1)' }), fmt(topo.ips_demais) + ' outros IPs ', h('b', { text: fmt(topo.acessos_demais) })])
    ]),
    linha1
  ];
  if (topo.comando_principal) {
    calloutKids.push(h('p', {}, ['O comando que ele mais rodou foi ', h('code', { text: topo.comando_principal }), ', ', fmt(topo.comando_principal_total), ' vezes.']));
  }
  calloutKids.push(h('p', { text: 'Um robô assim distorce qualquer contagem simples. Por isso o painel destaca os IPs distintos e tira esse IP dos gráficos por dia e por hora.' }));
  stack.appendChild(h('section', { 'class': 'card callout' }, calloutKids));
}

/* gráficos */
var grid = h('div', { 'class': 'cols' });
stack.appendChild(grid);

if (dias.length) {
  var ipsDia = dias.map(function (d) { return d.ips_unicos; });
  card(grid, {
    title: 'IPs distintos por dia',
    sub: 'Quantas origens diferentes apareceram em cada dia (UTC).',
    footnote: haParcial ? '* dia incompleto: a coleta começou ou terminou no meio do dia.' : null,
    build: function (viz) {
      var o = { cats: catsDia, values: ipsDia, name: 'IPs distintos', aria: 'IPs distintos por dia' };
      lineChart(viz, o);
      return { cols: [{ label: 'Dia (UTC)' }, { label: 'IPs distintos', num: true }], rows: dias.map(function (d, i) { return [catsDia[i].label, d.ips_unicos]; }) };
    }
  });
  var usaDemais = temTopo && dias[0].acessos_demais != null;
  var vDia = dias.map(function (d) { return usaDemais ? d.acessos_demais : d.acessos; });
  card(grid, {
    title: usaDemais ? 'Tentativas por dia, sem o IP mais ativo' : 'Tentativas por dia',
    sub: usaDemais ? 'O IP mais ativo ficou fora do gráfico para não esmagar os outros dias; o valor dele aparece ao passar o mouse.' : 'Contagem diária de tentativas de login (UTC).',
    footnote: haParcial ? '* dia incompleto.' : null,
    build: function (viz) {
      var extra = usaDemais ? [{ name: 'IP mais ativo (fora do gráfico)', values: dias.map(function (d) { return d.acessos_ip_mais_ativo; }) }] : [];
      columns(viz, { cats: catsDia, values: vDia, name: 'tentativas', extra: extra, aria: 'Tentativas de login por dia' });
      var cols = [{ label: 'Dia (UTC)' }, { label: 'Tentativas', num: true }];
      if (usaDemais) cols.push({ label: 'IP mais ativo', num: true });
      return { cols: cols, rows: dias.map(function (d, i) { var r = [catsDia[i].label, vDia[i]]; if (usaDemais) r.push(d.acessos_ip_mais_ativo); return r; }) };
    }
  });
}

var horas = D.por_hora_utc || [];
if (horas.length) {
  var mapaH = {};
  horas.forEach(function (x) { mapaH[x.hora] = x; });
  var cats24 = [], v24 = [], ex24 = [];
  var usaDemaisH = temTopo && horas[0].acessos_demais != null;
  for (var hh = 0; hh < 24; hh++) {
    var k = (hh < 10 ? '0' : '') + hh, it = mapaH[k];
    cats24.push({ label: k + 'h', title: k + 'h UTC', partial: false });
    v24.push(it ? (usaDemaisH ? it.acessos_demais : it.acessos) : 0);
    ex24.push(it && usaDemaisH ? it.acessos_ip_mais_ativo : 0);
  }
  card(grid, {
    title: usaDemaisH ? 'Tentativas por hora do dia, sem o IP mais ativo' : 'Tentativas por hora do dia',
    sub: 'Horário UTC (subtraia 3 horas para Brasília). Soma de todos os dias.',
    build: function (viz) {
      columns(viz, { cats: cats24, values: v24, name: 'tentativas', extra: usaDemaisH ? [{ name: 'IP mais ativo (fora do gráfico)', values: ex24 }] : [], aria: 'Tentativas por hora do dia' });
      return { cols: [{ label: 'Hora (UTC)' }, { label: 'Tentativas', num: true }], rows: cats24.map(function (c, i) { return [c.label, v24[i]]; }) };
    }
  });
}

var senhas = (D.top_senhas || []).slice(0, 10);
if (senhas.length) {
  card(grid, {
    title: 'Senhas mais tentadas',
    sub: 'As dez mais usadas nas tentativas de login (tentativas com chave pública não entram).',
    build: function (viz) {
      hbars(viz, senhas.map(function (s) { return { label: s.valor === '' ? '(vazia)' : s.valor, value: s.total }; }), { unit: 'tentativas', mono: true });
      return { cols: [{ label: 'Senha' }, { label: 'Tentativas', num: true }], rows: senhas.map(function (s) { return [s.valor === '' ? '(vazia)' : s.valor, s.total]; }) };
    }
  });
}
var usaUsrDemais = temTopo && !!D.top_usuarios_sem_ip_mais_ativo;
var usuarios = (usaUsrDemais ? D.top_usuarios_sem_ip_mais_ativo : (D.top_usuarios || [])).slice(0, 8);
if (usuarios.length) {
  card(grid, {
    title: usaUsrDemais ? 'Usuários mais tentados, sem o IP mais ativo' : 'Usuários mais tentados',
    sub: usaUsrDemais ? 'Nomes de usuário que os robôs tentam primeiro. O IP mais ativo ficou de fora para não dominar a lista.' : 'Nomes de usuário que os robôs tentam primeiro.',
    build: function (viz) {
      hbars(viz, usuarios.map(function (s) { return { label: s.valor === '' ? '(vazio)' : s.valor, value: s.total }; }), { unit: 'tentativas', mono: true });
      return { cols: [{ label: 'Usuário' }, { label: 'Tentativas', num: true }], rows: usuarios.map(function (s) { return [s.valor === '' ? '(vazio)' : s.valor, s.total]; }) };
    }
  });
}

var PORTAS = { 22: 'SSH', 23: 'Telnet', 25: 'SMTP (e-mail)', 53: 'DNS', 80: 'HTTP', 110: 'POP3', 143: 'IMAP', 443: 'HTTPS', 465: 'SMTPS', 587: 'SMTP (envio)', 993: 'IMAPS', 995: 'POP3S', 3306: 'MySQL', 3389: 'RDP', 8080: 'HTTP alternativo' };
var tun = D.tuneis || {};
var portas = (tun.portas_de_destino || []).slice(0, 8);
if (tun.total > 0 && portas.length) {
  card(grid, {
    title: 'Para onde os invasores tentaram abrir túneis',
    sub: 'Pedidos para usar a isca como ponte até outro servidor, por porta de destino.',
    build: function (viz) {
      var rows = portas.map(function (p) {
        var nome = PORTAS[p.valor];
        return { label: p.valor + (nome ? ' · ' + nome : ''), value: p.total };
      });
      hbars(viz, rows, { unit: 'pedidos', total: tun.total });
      return { cols: [{ label: 'Porta de destino' }, { label: 'Pedidos', num: true }], rows: rows.map(function (r) { return [r.label, r.value]; }) };
    }
  });
}

var paises = (D.paises || []).slice(0, 10);
if (paises.length) {
  card(grid, {
    title: 'IPs por país de origem',
    sub: 'País registrado para o endereço de origem. Pode não ser onde o invasor está de verdade (VPN, servidor alugado).',
    footnote: D.paises_fonte ? 'Fonte da localização: ' + D.paises_fonte + (D.paises_distintos ? ' · ' + D.paises_distintos + ' países no total' : '') + '.' : null,
    build: function (viz) {
      hbars(viz, paises.map(function (p) { return { label: p.valor, value: p.total }; }), { unit: 'IPs' });
      return { cols: [{ label: 'País' }, { label: 'IPs', num: true }], rows: paises.map(function (p) { return [p.valor, p.total]; }) };
    }
  });
}

/* comandos */
function tipoCmd(c) {
  var s = c.toLowerCase();
  if (/\\x[0-9a-f]{2}/.test(s) || /^echo\b/.test(s)) return 'Teste de resposta da shell';
  if (/_filter|v=outer|read -r|printf/.test(s)) return 'Teste de shell (possível detecção de honeypot)';
  if (/uname|\/proc\/|lscpu|whoami|\bid\b|hostname|\/etc\//.test(s)) return 'Reconhecimento do sistema';
  if (/chmod|nohup|sh -c|\.\/\S/.test(s)) return 'Execução de arquivo';
  if (/wget|curl|tftp|ftpget/.test(s)) return 'Download';
  return 'Outro';
}
var cmds = (D.comandos || {}).top || [];
if (cmds.length) {
  var tb = h('table', {}, [
    h('thead', {}, [h('tr', {}, [h('th', { text: 'Comando' }), h('th', { 'class': 'num', text: 'Vezes' }), h('th', { text: 'Tipo (classificação automática)' })])]),
    h('tbody', {}, cmds.slice(0, 10).map(function (c) {
      return h('tr', {}, [h('td', {}, [h('code', { text: c.valor })]), h('td', { 'class': 'num', text: fmt(c.total) }), h('td', {}, [h('span', { 'class': 'tag', text: tipoCmd(c.valor) })])]);
    }))
  ]);
  var cc = h('section', { 'class': 'card' }, [
    h('h2', { text: 'O que os invasores digitaram' }),
    h('p', { 'class': 'sub', text: 'Os dez comandos mais executados dentro da shell falsa.' + ((temTopo && topo.comando_principal === cmds[0].valor && topo.comando_principal_total >= 0.9 * cmds[0].total) ? ' O primeiro da lista vem quase todo do IP mais ativo.' : '') + ' A coluna de tipo vem de regras simples de texto e pode errar.' }),
    h('div', { 'class': 'tw' }, [tb])
  ]);
  stack.appendChild(cc);
}

/* arquivos */
if (up.length) {
  var vtLista = Array.isArray(D.virustotal) ? D.virustotal : [];
  var temVT = vtLista.length > 0;
  function achaVT(sha) {
    var s = String(sha || '').toLowerCase();
    for (var i = 0; i < vtLista.length; i++) {
      var p = String(vtLista[i].sha256_prefixo || '').toLowerCase();
      if (p.length >= 8 && s.indexOf(p) === 0) return vtLista[i];
    }
    return null;
  }
  var rowsUp = up.slice(0, 8).map(function (u) {
    var okHash = /^[0-9a-f]{64}$/i.test(u.sha256 || '');
    var cel = okHash
      ? h('a', { href: 'https://www.virustotal.com/gui/file/' + u.sha256, target: '_blank', rel: 'noopener noreferrer', text: u.sha256.slice(0, 12) + '…' })
      : h('span', { text: u.sha256 ? String(u.sha256).slice(0, 12) + '…' : '—' });
    var celulas = [h('td', {}, [h('code', { text: u.nome || '(sem nome)' })]), h('td', {}, [h('code', {}, [cel])])];
    if (temVT) {
      var v = achaVT(u.sha256);
      celulas.push(h('td', {}, [v ? h('span', {}, [h('strong', { text: String(v.placar || '') }), v.rotulo ? ' · ' + v.rotulo : '']) : '—']));
    }
    celulas.push(h('td', { 'class': 'num', text: fmt(u.total) }));
    return h('tr', {}, celulas);
  });
  stack.appendChild(h('section', { 'class': 'card' }, [
    h('h2', { text: 'Arquivos que os invasores enviaram à isca' }),
    h('p', { 'class': 'sub', text: 'Identificados pelo hash SHA-256. O link abre a análise pública do VirusTotal.' + (temVT ? ' Placares consultados em ' + Array.from(new Set(vtLista.map(function (v) { return v.consultado_em ? ddmm(String(v.consultado_em)) : ''; }).filter(Boolean))).sort().join(' e ') + '; podem mudar com o tempo.' : '') + ' Nenhum arquivo é publicado aqui.' }),
    h('div', { 'class': 'tw' }, [h('table', { 'class': 'last-num' }, [
      h('thead', {}, [h('tr', {}, [h('th', { text: 'Nome' }), h('th', { text: 'SHA-256' }), temVT ? h('th', { text: 'VirusTotal (placar · rótulo)' }) : null, h('th', { 'class': 'num', text: 'Vezes' })])]),
      h('tbody', {}, rowsUp)
    ])])
  ]));
}

/* sobre */
var rodape = h('footer', {});
var partes = [];
if (META.autor) partes.push(document.createTextNode('Projeto de ' + META.autor + '.'));
if (META.repo && /^https:\/\//.test(META.repo)) {
  if (partes.length) partes.push(document.createTextNode(' '));
  partes.push(h('a', { href: META.repo, target: '_blank', rel: 'noopener noreferrer', text: 'Código e metodologia no GitHub' }));
}
partes.forEach(function (p) { rodape.appendChild(p); });
stack.appendChild(h('section', { 'class': 'card about' }, [
  h('h2', { text: 'Sobre os dados' }),
  h('p', {}, [h('strong', { text: 'Honeypot: ' }), 'o Cowrie imita um servidor SSH e registra tudo o que o visitante faz. Ninguém legítimo usa esse servidor, então todo acesso é suspeito.']),
  h('p', {}, [h('strong', { text: 'Por que quase tudo é "aceito": ' }), 'a isca deixa o visitante entrar de propósito, para ver o que ele faz lá dentro. Isso não é uma falha de segurança.']),
  h('p', {}, [h('strong', { text: 'Tentativas, não ataques: ' }), 'muitas tentativas vêm de robôs automáticos, e um robô pode gerar milhares delas. Por isso o número de IPs distintos diz mais do que o de tentativas.']),
  h('p', {}, [h('strong', { text: 'Privacidade: ' }), 'este painel não mostra endereços IP. Os acessos do próprio autor foram removidos antes da análise.'])
]));
if (rodape.childNodes.length) stack.appendChild(rodape);
})();
</script>
</body>
</html>
